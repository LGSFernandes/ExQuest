<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>404 — ExQuest</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <style>
        body{
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            background:var(--bg)
        }
        .ec{
            text-align:center;
            max-width:420px;
            padding:48px 32px;

            border:1px solid var(--border);
            border-radius:var(--radius-xl)

        .n{
            font-family:'Syne',sans-serif;
            font-size:72px;
            font-weight:800;
            background:linear-gradient(135deg,#6366f1,#f472b6);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;background-clip:text
        }
    </style>
</head>
<body>
    <div class="ec">
        <div style="font-size:60px;margin-bottom:16px">&#x1F50D;</div>
        <div class="n">404</div>
        <h1 style="font-size:20px;margin:12px 0 8px">Não Encontrado</h1>
        <p style="color:var(--text-muted);font-size:14px;margin-bottom:24px">A página que você está procurando não existe.</p>
        <a href="/dashboard" class="btn btn-primary">&#8592; Voltar ao Dashboard</a>

</html>
