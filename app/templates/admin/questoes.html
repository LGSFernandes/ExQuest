{% extends 'base.html' %}
{% from '_ui.html' import icone, vazio, paginacao %}
{% block titulo %}Questões — Administração{% endblock %}
{% block conteudo %}
<div class="pagina-topo"><div><h1>Questões</h1><p>{{ pag.total }} no total.</p></div>
  <a class="btn btn-primary" href="{{ url_for('admin.questao_nova') }}">{{ icone('plus') }}Nova questão</a></div>
<form method="get" class="folha linha" data-busca-viva>
  <div class="campo"><label for="f-q">Buscar no enunciado</label><input id="f-q" class="entrada" name="q" type="search" value="{{ q }}" maxlength="100" autocomplete="off"></div>
  <div class="campo"><label for="f-m">Matéria</label><select id="f-m" class="selecao" name="materia_id"><option value="">Todas</option>
    {% for m in materias %}<option value="{{ m.id }}" {% if m.id == materia_id %}selected{% endif %}>{{ m.nome }}</option>{% endfor %}</select></div>
  <button class="btn btn-ghost" type="submit">{{ icone('search') }}Filtrar</button>
</form>
<div data-resultado aria-live="polite">{% include 'admin/_questoes_lista.html' %}</div>
{% endblock %}
