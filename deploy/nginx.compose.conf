# Usado pelo docker-compose.yml: o nome `web` resolve para todas as réplicas (DNS do Docker).
resolver 127.0.0.11 valid=10s;
# O proxy de borda (TLS) é quem sabe o esquema real: repassa o dele e, sem ele, usa o daqui.
map $http_x_forwarded_proto $esquema_real { default $http_x_forwarded_proto; "" $scheme; }
upstream exquest {
    least_conn;
    zone exquest 64k;
    server web:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
server {
    listen 80;
    client_max_body_size 6m;
    gzip_static on;                          # serve .gz pré-comprimido se existir (o app comprime o restante)

    location /static/data/ {                 # uploads do usuário: nunca executáveis, cache curto
        alias /srv/app/static/data/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://exquest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_real;
        proxy_set_header X-Forwarded-Host "";   # o app não confia em Host encaminhado pelo cliente
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
    }
}

# Host desconhecido: recuse no proxy de borda (TLS), que conhece o domínio; este aqui só atende a loopback.
