# Exemplo de nginx na frente do gunicorn (ajuste server_name e os caminhos do certificado).
# Os estáticos (inclui o KaTeX em /static/vendor/katex/) podem ser servidos direto pelo nginx
# ou repassados ao app: as duas opções funcionam; a segunda é a padrão abaixo.
# Várias instâncias do app (mesmo servidor ou servidores diferentes): o nginx distribui por menor número de conexões
# e tira do rodízio quem falhar. Para consultar /healthz ativamente use nginx Plus ou um balanceador gerenciado.
upstream exquest {
    least_conn;
    server 127.0.0.1:8000 max_fails=2 fail_timeout=10s;
    # server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
    # server 10.0.0.12:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}
server {
    listen 80;
    server_name exemplo.com.br;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name exemplo.com.br;
    ssl_certificate     /etc/letsencrypt/live/exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemplo.com.br/privkey.pem;
    client_max_body_size 6m;                 # uploads de imagem (limite real é validado no app)

    # Opção A (mais rápida): nginx serve os estáticos. Troque /srv/exquest pelo diretório do app.
    # Os tipos MIME precisam estar corretos (woff2, js, css), senão o navegador recusa o KaTeX.
    location /static/ {
        alias /srv/exquest/app/static/;
        gzip_static on;
        # Os arquivos têm ?v=<hash do conteúdo>: cache de 1 ano é seguro (a URL muda quando o arquivo muda).
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        # Fontes carregadas de outra origem (CDN_URL) exigem CORS; descomente se o nginx também for a origem do CDN.
        # add_header Access-Control-Allow-Origin "https://exemplo.com.br";
    }

    # Uploads de usuários não têm hash na URL: cache curto (mais específico que /static/, por isso vence).
    location /static/data/ {
        alias /srv/exquest/app/static/data/;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://exquest;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Opção B: apague o bloco `location /static/` acima. O app serve os estáticos (hash na URL, cache imutável e Brotli/Gzip).
# Compressão: o app já aplica Brotli/Gzip (Flask-Compress). Não ligue `gzip on` no nginx para a rota `/`, para não comprimir duas vezes.
# Atenção: o app já envia a Content-Security-Policy; não adicione outra no nginx (duas políticas se somam e a mais restrita vence).
# Uploads (app/static/data/) são dados do usuário: mantenha em volume persistente (ver docker-compose.yml).

# Host desconhecido (varredura por IP, Host forjado): recusa sem encaminhar ao app. Em Docker/Compose coloque isto também no proxy de borda.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate     /etc/letsencrypt/live/exemplo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemplo.com.br/privkey.pem;
    return 444;
}
